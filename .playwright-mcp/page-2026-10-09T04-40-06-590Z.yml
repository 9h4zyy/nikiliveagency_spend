    - generic [ref=f13e135]:
      - heading "Frequently Asked Questions" [level=2] [ref=f13e137]
      - generic [ref=f13e138]:
        - article [ref=f13e139]:
          - button "What is a Niki Live sub-agent?" [ref=f13e140] [cursor=pointer]
          - paragraph [ref=f13e146]: A Niki Live sub-agent is a partner who operates under a primary agency account. They work as an independent agency while following the same platform rules, responsibilities, and privileges.
        - article [ref=f13e147]:
          - button "Can I invite hosts or sub-agents from another agency?" [ref=f13e148] [cursor=pointer]
          - paragraph [ref=f13e154]: No. Recruiting hosts or sub-agents who are currently registered with another Niki Live agency is prohibited. They must leave their existing agency before joining a new one.
        - article [ref=f13e155]:
          - button "What are the benefits of inviting sub-agents?" [ref=f13e156] [cursor=pointer]
          - paragraph [ref=f13e162]: Inviting sub-agents provides additional growth opportunities for your agency. Sub-agent performance contributes to your agency development, and higher sub-agent revenue can help increase your overall commission level.
        - article [ref=f13e163]:
          - button "Where can I find potential hosts or sub-agents to invite?" [ref=f13e164] [cursor=pointer]
          - paragraph [ref=f13e170]: "Potential hosts and sub-agents can be found through various online communities and social platforms, including: Facebook, Telegram, X, and other social media communities. Always ensure recruitment follows Niki Live agency policies."
        - article [ref=f13e171]:
          - button "What rewards can I receive from inviting hosts or sub-agents?" [ref=f13e172] [cursor=pointer]
          - paragraph [ref=f13e178]:
            - text: New Niki Live agents may receive rewards from successful recruitment of eligible hosts. Reward programs and requirements may vary. Visit the
            - link "Become an Agent" [ref=f13e179] [cursor=pointer]:
              - /url: /become-a-agent
            - text: page for complete reward information.
