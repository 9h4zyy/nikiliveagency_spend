          - button "Where can I find potential hosts or sub-agents to invite?" [ref=e139] [cursor=pointer]
          - paragraph [ref=e145]: "Potential hosts and sub-agents can be found through various online communities and social platforms, including: Facebook, Telegram, X, and other social media communities. Always ensure recruitment follows Niki Live agency policies."
