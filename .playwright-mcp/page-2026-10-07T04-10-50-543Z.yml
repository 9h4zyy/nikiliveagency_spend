          - button "What is a Niki Live sub-agent?" [ref=e115] [cursor=pointer]
          - paragraph [ref=e121]: A Niki Live sub-agent is a partner who operates under a primary agency account. They work as an independent agency while following the same platform rules, responsibilities, and privileges.
        - article [ref=e122]:
          - button "Can I invite hosts or sub-agents from another agency?" [ref=e123] [cursor=pointer]
          - paragraph [ref=e129]: No. Recruiting hosts or sub-agents who are currently registered with another Niki Live agency is prohibited. They must leave their existing agency before joining a new one.
        - article [ref=e130]:
          - button "What are the benefits of inviting sub-agents?" [ref=e131] [cursor=pointer]
          - paragraph [ref=e137]: Inviting sub-agents provides additional growth opportunities for your agency. Sub-agent performance contributes to your agency development, and higher sub-agent revenue can help increase your overall commission level.
