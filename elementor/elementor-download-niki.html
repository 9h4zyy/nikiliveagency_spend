<!-- Internal JavaScript for Elementor HTML block -->
<script>
  (function() {
    // Welcome Pill Carousel Controller
    var pillSlides = document.querySelectorAll('.download-pill-slide');
    var pillDots = document.querySelectorAll('#download-pill-dots .carousel-dot');
    var prevPillBtn = document.getElementById('prev-pill-btn');
    var nextPillBtn = document.getElementById('next-pill-btn');
    var pillWrapper = document.querySelector('.download-pill-carousel-wrapper');

    if (pillSlides.length > 0) {
      var currentPillIdx = 0;
      var pillTimer = null;

      function showPillSlide(idx) {
        if (idx < 0) {
          idx = pillSlides.length - 1;
        } else if (idx >= pillSlides.length) {
          idx = 0;
        }
        currentPillIdx = idx;

        for (var i = 0; i < pillSlides.length; i++) {
          var isActive = (i === currentPillIdx);
          pillSlides[i].classList.toggle('active', isActive);
          if (pillDots[i]) {
            pillDots[i].classList.toggle('active', isActive);
            pillDots[i].setAttribute('aria-selected', isActive ? 'true' : 'false');
          }
        }
      }

      function nextPill() {
        showPillSlide(currentPillIdx + 1);
      }

      function prevPill() {
        showPillSlide(currentPillIdx - 1);
      }

      function startPillAuto() {
        stopPillAuto();
        pillTimer = setInterval(nextPill, 3500);
      }

      function stopPillAuto() {
        if (pillTimer) {
          clearInterval(pillTimer);
          pillTimer = null;
        }
      }

      if (prevPillBtn) {
        prevPillBtn.addEventListener('click', function(e) {
          e.preventDefault();
          prevPill();
          startPillAuto();
        });
      }

      if (nextPillBtn) {
        nextPillBtn.addEventListener('click', function(e) {
          e.preventDefault();
          nextPill();
          startPillAuto();
        });
      }

      for (var p = 0; p < pillDots.length; p++) {
        (function(dotIndex) {
          pillDots[dotIndex].addEventListener('click', function() {
            showPillSlide(dotIndex);
            startPillAuto();
          });
        })(p);
      }

      if (pillWrapper) {
        pillWrapper.addEventListener('mouseenter', stopPillAuto);
        pillWrapper.addEventListener('mouseleave', startPillAuto);

        var touchStartX = 0;
        var touchEndX = 0;
        pillWrapper.addEventListener('touchstart', function(e) {
          if (e.changedTouches && e.changedTouches[0]) {
            touchStartX = e.changedTouches[0].screenX;
          }
          stopPillAuto();
        }, { passive: true });

        pillWrapper.addEventListener('touchend', function(e) {
          if (e.changedTouches && e.changedTouches[0]) {
            touchEndX = e.changedTouches[0].screenX;
          }
          if (touchStartX - touchEndX > 40) {
            nextPill();
          } else if (touchEndX - touchStartX > 40) {
            prevPill();
          }
          startPillAuto();
        }, { passive: true });

        pillWrapper.setAttribute('tabindex', '0');
        pillWrapper.addEventListener('keydown', function(e) {
          if (e.key === 'ArrowLeft') {
            prevPill();
            startPillAuto();
          } else if (e.key === 'ArrowRight') {
            nextPill();
            startPillAuto();
          }
        });
      }

      startPillAuto();
    }

    // 2. Phone Screenshots Carousel Controller
    var phoneTrack = document.getElementById('phone-carousel-track');
    var phonePrevBtn = document.getElementById('carousel-prev-btn');
    var phoneNextBtn = document.getElementById('carousel-next-btn');
    var phoneDots = document.querySelectorAll('#phone-carousel-dots .carousel-dot');
    var phoneShowcase = document.getElementById('phone-showcase');
    var totalPhoneSlides = 5;
    var currentPhoneSlide = 0;
    var phoneTimer = null;

    function updatePhoneSlide(index) {
      currentPhoneSlide = (index + totalPhoneSlides) % totalPhoneSlides;
      if (phoneTrack) {
        phoneTrack.style.transform = 'translateX(-' + (currentPhoneSlide * 100) + '%)';
      }
      phoneDots.forEach(function(dot, i) {
        if (i === currentPhoneSlide) {
          dot.classList.add('is-active');
          dot.setAttribute('aria-selected', 'true');
        } else {
          dot.classList.remove('is-active');
          dot.setAttribute('aria-selected', 'false');
        }
      });
    }

    function nextPhoneSlide() {
      updatePhoneSlide(currentPhoneSlide + 1);
    }

    function prevPhoneSlide() {
      updatePhoneSlide(currentPhoneSlide - 1);
    }

    function startPhoneAuto() {
      stopPhoneAuto();
      phoneTimer = setInterval(nextPhoneSlide, 3400);
    }

    function stopPhoneAuto() {
      if (phoneTimer) {
        clearInterval(phoneTimer);
        phoneTimer = null;
      }
    }

    if (phonePrevBtn) {
      phonePrevBtn.addEventListener('click', function() {
        prevPhoneSlide();
        startPhoneAuto();
      });
    }

    if (phoneNextBtn) {
      phoneNextBtn.addEventListener('click', function() {
        nextPhoneSlide();
        startPhoneAuto();
      });
    }

    phoneDots.forEach(function(dot) {
      dot.addEventListener('click', function() {
        var targetIndex = parseInt(dot.getAttribute('data-dot-index'), 10);
        if (!isNaN(targetIndex)) {
          updatePhoneSlide(targetIndex);
          startPhoneAuto();
        }
      });
    });

    if (phoneShowcase) {
      phoneShowcase.addEventListener('mouseenter', stopPhoneAuto);
      phoneShowcase.addEventListener('mouseleave', startPhoneAuto);
    }

    if (phoneTrack) {
      var phoneTouchStartX = 0;
      var phoneTouchEndX = 0;

      phoneTrack.addEventListener('touchstart', function(e) {
        if (e.changedTouches && e.changedTouches[0]) {
          phoneTouchStartX = e.changedTouches[0].screenX;
        }
        stopPhoneAuto();
      }, { passive: true });

      phoneTrack.addEventListener('touchend', function(e) {
        if (e.changedTouches && e.changedTouches[0]) {
          phoneTouchEndX = e.changedTouches[0].screenX;
        }
        var diffX = phoneTouchEndX - phoneTouchStartX;
        if (Math.abs(diffX) > 40) {
          if (diffX < 0) {
            nextPhoneSlide();
          } else {
            prevPhoneSlide();
          }
        }
        startPhoneAuto();
      }, { passive: true });
    }

    startPhoneAuto();

    // 3. Global Image Lightbox Viewer
    function initImageLightbox() {
      var images = Array.prototype.slice.call(document.querySelectorAll('main img, .hero-img, .tutorial-img, .step-card-img, .guide-img, .growth-slide-img, .hero-image-frame img, .tutorial-image-frame img, .guide-image-box img'));
      images = images.filter(function(img) {
        return img.src && !img.closest('header') && !img.closest('footer') && !img.classList.contains('brand-icon-box') && !img.classList.contains('brand-logo-img');
      });
      if (!images.length) return;

      var overlay = document.getElementById('site-lightbox-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'site-lightbox-overlay';
        overlay.className = 'site-lightbox-overlay';
        overlay.setAttribute('role', 'dialog');
        overlay.setAttribute('aria-modal', 'true');
        overlay.setAttribute('aria-label', 'Image preview');
        overlay.innerHTML =
          '<div class="lightbox-top-bar">' +
            '<span class="lightbox-counter-badge" id="lightbox-counter">1 / 1</span>' +
            '<button type="button" class="lightbox-close-btn" id="lightbox-close-btn" aria-label="Close image preview">' +
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
                '<line x1="18" y1="6" x2="6" y2="18"></line>' +
                '<line x1="6" y1="6" x2="18" y2="18"></line>' +
              '</svg>' +
            '</button>' +
          '</div>' +
          '<button type="button" class="lightbox-nav-btn lightbox-nav-prev" id="lightbox-prev-btn" aria-label="Previous image">' +
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="m15 18-6-6 6-6"></path>' +
            '</svg>' +
          '</button>' +
          '<div class="lightbox-content-box">' +
            '<div class="lightbox-img-wrapper">' +
              '<img class="lightbox-preview-img" id="lightbox-img" src="" alt="">' +
            '</div>' +
            '<p class="lightbox-caption-text" id="lightbox-caption"></p>' +
          '</div>' +
          '<button type="button" class="lightbox-nav-btn lightbox-nav-next" id="lightbox-next-btn" aria-label="Next image">' +
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="m9 18 6-6-6-6"></path>' +
            '</svg>' +
          '</button>';
        document.body.appendChild(overlay);
      }

      var lightboxImg = document.getElementById('lightbox-img');
      var lightboxCaption = document.getElementById('lightbox-caption');
      var lightboxCounter = document.getElementById('lightbox-counter');
      var closeBtn = document.getElementById('lightbox-close-btn');
      var prevBtn = document.getElementById('lightbox-prev-btn');
      var nextBtn = document.getElementById('lightbox-next-btn');

      var currentIdx = 0;

      function showLightboxImage(index) {
        if (index < 0) index = images.length - 1;
        if (index >= images.length) index = 0;
        currentIdx = index;

        var target = images[currentIdx];
        lightboxImg.src = target.currentSrc || target.src;
        lightboxImg.alt = target.alt || 'Preview image';
        lightboxCaption.textContent = target.alt || '';
        lightboxCounter.textContent = (currentIdx + 1) + ' / ' + images.length;

        if (images.length <= 1) {
          prevBtn.style.display = 'none';
          nextBtn.style.display = 'none';
          lightboxCounter.style.display = 'none';
        } else {
          prevBtn.style.display = 'flex';
          nextBtn.style.display = 'flex';
          lightboxCounter.style.display = 'inline-block';
        }
      }

      function openLightbox(index) {
        showLightboxImage(index);
        overlay.classList.add('is-active');
        document.body.classList.add('lightbox-open');
      }

      function closeLightbox() {
        overlay.classList.remove('is-active');
        document.body.classList.remove('lightbox-open');
      }

      images.forEach(function(img, i) {
        img.addEventListener('click', function(e) {
          e.preventDefault();
          openLightbox(i);
        });
      });

      if (closeBtn) {
        closeBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          closeLightbox();
        });
      }

      if (prevBtn) {
        prevBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          showLightboxImage(currentIdx - 1);
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          showLightboxImage(currentIdx + 1);
        });
      }

      overlay.addEventListener('click', function(e) {
        if (e.target === overlay || e.target.classList.contains('lightbox-content-box') || e.target.classList.contains('lightbox-img-wrapper')) {
          closeLightbox();
        }
      });

      document.addEventListener('keydown', function(e) {
        if (!overlay.classList.contains('is-active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') showLightboxImage(currentIdx - 1);
        if (e.key === 'ArrowRight') showLightboxImage(currentIdx + 1);
      });

      var touchStartX = 0;
      var touchEndX = 0;
      overlay.addEventListener('touchstart', function(e) {
        if (e.changedTouches && e.changedTouches[0]) {
          touchStartX = e.changedTouches[0].screenX;
        }
      }, { passive: true });

      overlay.addEventListener('touchend', function(e) {
        if (e.changedTouches && e.changedTouches[0]) {
          touchEndX = e.changedTouches[0].screenX;
        }
        if (touchStartX - touchEndX > 50) {
          showLightboxImage(currentIdx + 1);
        } else if (touchEndX - touchStartX > 50) {
          showLightboxImage(currentIdx - 1);
        }
      }, { passive: true });
    }

    initImageLightbox();
  })();
</script>
